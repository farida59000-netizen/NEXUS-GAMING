<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Gaming</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090711;color:white;font-family:Arial,sans-serif}
header{padding:25px 18px;text-align:center;background:#130c25;border-bottom:1px solid #8b35ff}
h1{color:#b56aff;font-size:38px;margin:0}
header p{color:#c5b5d8}
main{padding:20px;max-width:900px;margin:auto}
h2{color:#c58aff}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.game{background:#191329;border:1px solid #553080;border-radius:14px;padding:18px;text-align:center}
.emoji{font-size:42px}
button{background:#8b35ff;color:white;border:0;padding:10px 16px;border-radius:8px;font-weight:bold}
footer{text-align:center;color:#887a9c;padding:30px}
</style>
</head>
<body>
<header>
<h1>NEXUS</h1>
<p>TON UNIVERS GAMING</p>
</header>
<main>
<h2>🎮 Découvre les jeux</h2>
<div class="games">
<div class="game"><div class="emoji">🚗</div><h3>Rocket League</h3><p>Jeu gratuit</p><button onclick="alert('Découvre Rocket League sur son site officiel !')">Découvrir</button></div>
<div class="game"><div class="emoji">🚌</div><h3>Fortnite</h3><p>Battle Royale</p><button onclick="alert('Découvre Fortnite sur son site officiel !')">Découvrir</button></div>
<div class="game"><div class="emoji">⛏️</div><h3>Minecraft</h3><p>Survie et création</p><button onclick="alert('Découvre Minecraft sur son site officiel !')">Découvrir</button></div>
<div class="game"><div class="emoji">⚔️</div><h3>Jeux PC</h3><p>À découvrir</p><button onclick="alert('Bientôt sur NEXUS !')">Découvrir</button></div>
</div>
</main>
<footer>© NEXUS GAMING</footer>
</body>
</html>
